name: Aggiorna e pubblica la previsione

on:
  schedule:
    # Ogni tre ore, in UTC. Il minuto 17 riduce i possibili ritardi del servizio.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fetch-outcome: ${{ steps.fetch.outcome }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Installa le dipendenze
        run: python -m pip install -r requirements-pages.txt

      - name: Ripristina i punti meteo gia acquisiti
        id: meteo-cache
        uses: actions/cache/restore@v5
        with:
          path: data/elbameteo.sqlite*
          key: meteo-v1-${{ runner.os }}-${{ hashFiles('config.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            meteo-v1-${{ runner.os }}-${{ hashFiles('config.json') }}-

      - name: Acquisisce l'ultima run ECMWF completa
        id: fetch
        continue-on-error: true
        timeout-minutes: 18
        run: python fetch_latest.py

      - name: Conserva anche i download parziali
        if: always() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure')
        uses: actions/cache/save@v5
        with:
          path: data/elbameteo.sqlite*
          key: ${{ steps.meteo-cache.outputs.cache-primary-key }}

      - name: Genera HTML e PNG
        if: steps.fetch.outcome == 'success'
        run: python forecast_visualization.py

      - name: Mantiene online la previsione gia pubblicata
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Acquisizione incompleta; nessuna pubblicazione. Il sito gia online resta invariato."

      - name: Prepara il sito statico
        if: steps.fetch.outcome == 'success'
        shell: bash
        run: |
          mkdir -p _site/maps
          cp output/ultima_previsione.html _site/index.html
          cp output/ultima_previsione.png _site/ultima_previsione.png
          cp output/maps/elba_aree_ecmwf_9km.png _site/maps/
          touch _site/.nojekyll

      - name: Configura GitHub Pages
        if: steps.fetch.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Carica il sito
        if: steps.fetch.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.fetch-outcome == 'success'
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report-fetch-failure:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.fetch-outcome == 'failure'
    steps:
      - name: Segnala il mancato aggiornamento dei dati
        run: |
          echo "La pagina precedente resta online, ma Open-Meteo non ha fornito i nuovi dati."
          exit 1
