name: Aggiorna e pubblica la previsione

on:
  schedule:
    # Ogni tre ore, in UTC. Il minuto 17 riduce i possibili ritardi del servizio.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      fetch-outcome: ${{ steps.fetch.outcome }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Installa le dipendenze
        run: python -m pip install -r requirements-pages.txt

      - name: Acquisisce l'ultima run ECMWF completa
        id: fetch
        continue-on-error: true
        run: python fetch_latest.py

      - name: Genera HTML e PNG
        if: steps.fetch.outcome == 'success'
        run: python forecast_visualization.py

      - name: Segnala il riuso dell'ultima previsione valida
        if: steps.fetch.outcome != 'success'
        run: echo "Open-Meteo non disponibile; pubblico i file validi presenti nel repository."

      - name: Prepara il sito statico
        shell: bash
        run: |
          mkdir -p _site/maps
          cp output/ultima_previsione.html _site/index.html
          cp output/ultima_previsione.png _site/ultima_previsione.png
          cp output/maps/elba_aree_ecmwf_9km.png _site/maps/
          touch _site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report-fetch-failure:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.fetch-outcome != 'success'
    steps:
      - name: Segnala il mancato aggiornamento dei dati
        run: |
          echo "La pagina precedente resta online, ma Open-Meteo non ha fornito i nuovi dati."
          exit 1
